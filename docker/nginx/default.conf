server {
    listen 80;
    server_name localhost;
    root /var/www/backend/public;
    index index.php index.html;

    client_max_body_size 50M;

    # API and Sanctum requests route to Laravel PHP-FPM
    location ^~ /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Public storage files route directly to backend/storage/app/public
    location ^~ /storage {
        alias /var/www/backend/storage/app/public;
        try_files $uri =404;
        access_log off;
        expires max;
    }

    # PHP handling via FastCGI
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Frontend routes proxy to Vite container (or fallback to index.html in prod)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny hidden files
    location ~ /\.ht {
        deny all;
    }
}
